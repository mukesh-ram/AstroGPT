name: astrogpt-backend
type: web
runtime: docker
regions:
  - fra
ports:
  - port: 8080
    protocol: http
scaling:
  min: 1
  max: 1
env:
  - name: GEMINI_API_KEY
    value_from_secret: gemini-api-key
  - name: FIREBASE_CREDENTIALS_JSON
    value_from_secret: firebase-credentials-json
  - name: CORS_ALLOWED_ORIGINS
    value: https://astrogpt.vercel.app
health_checks:
  - path: /actuator/health
    port: 8080
    interval: 10
    timeout: 5
    healthy_threshold: 1
    unhealthy_threshold: 3
