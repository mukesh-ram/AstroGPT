name: AstroGPT CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Backend Tests
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: ./mvnw test -Dspring.profiles.active=test
        env:
          GEMINI_API_KEY: test-key-not-real
          FIREBASE_CREDENTIALS_JSON: ""

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  # ──────────────────────────────────────────────
  # Job 2: Frontend Build & Lint
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Angular 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build -- --configuration=production

      - name: Run unit tests (headless)
        run: npm run test -- --watch=false --browsers=ChromeHeadless

  # ──────────────────────────────────────────────
  # Job 3: Docker Build Validation
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: astrogpt-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Job 4: E2E Tests (Selenium + Cucumber)
  # Runs only on PRs after unit tests pass
  # ──────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Selenium + Cucumber)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'pull_request'

    services:
      backend:
        image: eclipse-temurin:21-jre
        # Note: In real CI, start the backend service here

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Cucumber BDD tests
        run: |
          cd qa
          ./mvnw test -Dapp.url=http://localhost:4200 -Dwebdriver.chrome.driver=/usr/bin/chromedriver
        env:
          HEADLESS: true
        continue-on-error: true  # Don't block on E2E failures in early dev

      - name: Upload Cucumber reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports
          path: qa/target/cucumber-reports/

  # ──────────────────────────────────────────────
  # Job 5: Deploy to Koyeb (Backend) - main only
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Koyeb
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | bash

      - name: Deploy to Koyeb
        run: koyeb service redeploy astrogpt-backend
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
